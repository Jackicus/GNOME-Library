# Copied from the GNOME-EXTENSIONS kit (template/.github/ISSUE_TEMPLATE/feature.yml) by its
# scripts/sync.sh: change it there.
name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The extension aims to look and behave like part of GNOME. Ideas that fit the
        [GNOME Human Interface Guidelines](https://developer.gnome.org/hig/) are the
        easiest to take on.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How should it work? Mock-ups and comparisons with GNOME's own apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
