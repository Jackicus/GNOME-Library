# What the kit's shared scripts (dev.sh, nested.sh, dev-extension.js, kit.mk)
# need to know about this extension. Sourced by bash.
EXT_UUID=library-menu@jackicus
EXT_NAME='Library Menu'
# The prefix every log line carries, and the class lib/app.js exports.
EXT_LOG_PREFIX='[Library Menu]'
EXT_APP_CLASS=LibraryApp
# What ships besides the entry points, metadata, stylesheet and schema: DIR:PATTERN under src/.
EXT_SHIP=("lib:*.js" "backend:*.js" "icons:*.svg")
# dev.sh commands 'dev.sh check' (and so 'make check') runs after the schema.
EXT_CHECKS=(scanner)
# Helpers 'nested.sh stop' sweeps if they outlive the session: the virtual pad.
NESTED_STRAYS=("$REPO_DIR/scripts/vpad.py")
# Stand-in commands overlaid on /usr/bin under 'start --stand-in'.
EXT_STAND_IN_BINS=()
# Variables removed from the environment under 'start --stand-in': the scanner falls back
# on a real TMDB key in $LIBRARY_TMDB_KEY.
EXT_STAND_IN_UNSET=(LIBRARY_TMDB_KEY)
# Development tools this extension's scripts use beyond the kit's, CHECK|PACKAGE|WHAT FOR;
# the kit's 'scripts/setup.sh --tools' lists the missing ones.
EXT_TOOLS=("py:PIL|python-pillow|the demo library (start --stand-in)" "py:evdev|python-evdev|vpad.py, a virtual pad")
# Lines of JavaScript under src/ not to grow past ('dev.sh size'; the kit's simplicity rule).
# The size at the 1.0 release (8,589 on 2026-10-02), rounded up to the next hundred.
EXT_BUDGET_LINES=8600
